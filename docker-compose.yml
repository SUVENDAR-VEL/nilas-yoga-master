version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  Yoga Master — Docker Compose
#
#  Profiles:
#    prod  →  docker compose --profile prod up --build
#    dev   →  docker compose --profile dev  up
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Production: multi-stage build → Nginx static server ───────────────────
  yoga-master:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: yoga-master-prod
    image: yoga-master:latest
    network_mode: "host"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.yoga-master.environment=production"

  # ── Development: Vite HMR dev server with live-reload ─────────────────────
  yoga-master-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: yoga-master-dev
    image: yoga-master:dev
    network_mode: "host"
    volumes:
      # Mount source for hot-module replacement
      - .:/app
      # Prevent host node_modules from overriding container's
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true   # needed on some Windows/macOS setups
    restart: unless-stopped
    labels:
      - "com.yoga-master.environment=development"
