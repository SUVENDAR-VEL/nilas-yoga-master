services:

  # ── Production ─────────────────────────────
  yoga-master:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: yoga-master-prod
    image: yoga-master:latest
    ports:
      - "3002:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.yoga-master.environment=production"

  # ── Development ────────────────────────────
  yoga-master-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: yoga-master-dev
    image: yoga-master:dev
    ports:
      - "3001:5173"   # Vite default port
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
    labels:
      - "com.yoga-master.environment=development"